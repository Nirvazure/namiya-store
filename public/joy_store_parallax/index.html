<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解忧杂货店</title><style>*{box-sizing:border-box}body{margin:0;background:#151b28;color:#f9e9ca;font-family:serif;overflow-x:hidden}.hero{height:100vh;min-height:650px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#48566a,#171c2a 75%)}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:77px 73px;opacity:.25}.scene{position:absolute;left:50%;top:53%;width:min(88vw,850px);aspect-ratio:1;transform:translate(-50%,-50%)}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.title{position:absolute;top:8%;left:0;right:0;text-align:center;z-index:5;font-size:clamp(32px,5vw,68px);letter-spacing:.15em;text-shadow:0 3px 18px #000}.hint{position:absolute;bottom:5%;left:0;right:0;text-align:center;letter-spacing:.3em;font-size:12px}.story{min-height:100vh;padding:24vh 10vw;text-align:center;background:#f0e4cc;color:#36352e}.story h2{font-size:clamp(28px,5vw,54px)}.story p{line-height:2.4}.overlay{opacity:0} @media(max-width:600px){.scene{width:115vw;top:55%}.title{top:13%}}</style></head><body><section class="hero"><div class="stars"></div><h1 class="title">解忧杂货店</h1><div class="scene"><img class="base" src="assets/building_base.png" alt="手绘杂货店"><img class="overlay" data-depth="1.4" src="assets/roof_antenna.png"><img class="overlay" data-depth="1.1" src="assets/awning.png"><img class="overlay" data-depth="1.8" src="assets/bicycle.png"><img class="overlay" data-depth="1.3" src="assets/plants.png"></div><div class="hint">向下滚动 · 开启故事 ↓</div></section><section class="story"><h2>欢迎来到解忧杂货店</h2><p>每一封信，都有它自己的故事。</p></section><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script><script>gsap.registerPlugin(ScrollTrigger);gsap.to('.base',{y:-65,scale:1.06,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});gsap.to('.stars',{y:130,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});gsap.to('.title',{y:-140,opacity:0,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'70% top',scrub:true}});document.querySelectorAll('.overlay').forEach(el=>{gsap.to(el,{y:-65*Number(el.dataset.depth),ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}})});</script></body></html>
